<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stránka nenalezena – Holasovi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/assets/css/styl.css">
  <style>
    .chyba {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 32px 28px;
      max-width: 420px;
      margin: 16px;
      text-align: center;
      border-radius: 18px;
      background: rgba(28, 18, 8, 0.6);
    }
    .chyba h1 { margin: 0; font-family: 'Cinzel', serif; font-size: 26px; letter-spacing: 0.04em; color: #ffe7a6; }
    .chyba p { margin: 0; font-size: 20px; font-style: italic; }
    .chyba a { color: #ffe7a6; font-size: 19px; }
  </style>
</head>
<body>
  <main class="scena">
    <div class="scena__pozadi" aria-hidden="true" style="background-image: url(/assets/img/pozadi.webp)"></div>
    <div class="chyba">
      <h1>Tady nic neroste</h1>
      <p>Hledaná stránka neexistuje.</p>
      <a href="/">Zpět k rodinnému stromu</a>
    </div>
  </main>
</body>
</html>
